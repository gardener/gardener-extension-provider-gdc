apiVersion: v1
kind: ConfigMap
metadata:
  name: kvcsi-annotations-allowlist
  namespace: {{ $.Release.Namespace }}
  labels:
    app: kubevirt-csi-driver
    role: controller
data:
  # One annotation key per line. These four were previously hardcoded in the
  # controller, so they must be listed here to preserve gke.21 behavior.
  # More can be added later without a driver change.
  allowlist: |-
    cdi.kubevirt.io/externalPopulation
    trident.netapp.io/isMirrorDestination
    cdi.kubevirt.io/storage.usePopulator
    fileblock.storage.private.gdc.goog/snapshot-space
