{{- if .Values.zones }}
apiVersion: v1
kind: Secret
metadata:
  name: infra-cluster-kubeconfig
  namespace: "{{ .Release.Namespace }}"
type: Opaque
data:
{{- range $i, $zone := .Values.zones }}
{{- $kubeconfig := index $.Values.infraClusterkubeconfig $zone }}
  {{ $zone }}: {{ $kubeconfig | b64enc }}
{{- end }}
{{- else }}
{{- $firstKey := (keys .Values.infraClusterkubeconfig | first) }}
{{- $first := index .Values.infraClusterkubeconfig $firstKey }}
apiVersion: v1
kind: Secret
metadata:
  name: infra-cluster-kubeconfig
  namespace: "{{ .Release.Namespace }}"
type: Opaque
data:
  kubeconfig: {{ $first | b64enc }}
{{- end }}