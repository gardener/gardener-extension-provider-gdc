{{- range $index, $machineClass := .Values.machineClasses }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $machineClass.name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
{{- if $machineClass.resourceLabels }}
  labels:
{{ toYaml $machineClass.resourceLabels | indent 4 }}
{{- end }}
type: Opaque
data:
  userData: {{ $machineClass.secret.cloudConfig | b64enc | quote }}
---
apiVersion: machine.sapcloud.io/v1alpha1
kind: MachineClass
metadata:
  name: {{ $machineClass.name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
{{- if $machineClass.nodeTemplate }}
nodeTemplate:
  capacity:
{{ toYaml $machineClass.nodeTemplate.capacity | indent 4 }}
{{- if $machineClass.nodeTemplate.virtualCapacity }}
  virtualCapacity:
{{ toYaml $machineClass.nodeTemplate.virtualCapacity | indent 4 }}
{{- end }}
  instanceType: {{ $machineClass.nodeTemplate.instanceType | quote }}
  region: {{ $machineClass.nodeTemplate.region | quote }}
  zone: {{ $machineClass.nodeTemplate.zone | quote }}
{{- end }}
providerSpec:
  addressPoolName: {{ $machineClass.addressPoolName | quote }}
  subnetName: {{ $machineClass.subnetName | quote }}
  project: {{ $machineClass.project | quote }}
  orgClusterURL: {{ $machineClass.orgClusterURL | quote }}
  registryURL: {{ $machineClass.registryURL | quote }}
  caData: {{ $machineClass.caData | quote }}
  enableEgress: {{$machineClass.enableEgress}}
  disks:
{{ toYaml $machineClass.disks | indent 2 }}
{{- if $machineClass.labels }}
  labels:
{{ toYaml $machineClass.labels | indent 4 }}
{{- end }}
  machineType: {{ $machineClass.machineType | quote }}
{{- if $machineClass.annotations }}
  annotations:
{{ toYaml $machineClass.annotations | indent 2 }}
{{- end }}
secretRef:
  name: {{ $machineClass.name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
credentialsSecretRef:
  name: {{ $machineClass.credentialsSecretRef.name | quote }}
  namespace: {{ $machineClass.credentialsSecretRef.namespace | quote }}
provider: "GDCH"
{{- end }}
